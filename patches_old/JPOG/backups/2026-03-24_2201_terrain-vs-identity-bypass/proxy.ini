; JPOG Matrix-Capture Proxy — Runtime Configuration
;
; Place next to d3d9.dll in the game directory.

[Remix]
; Chain-load RTX Remix.  The current d3d9.dll (Remix bridge) must be
; renamed to d3d9_remix.dll so our proxy can sit in front of it.
Enabled=1
DLLName=d3d9_remix.dll

[ABTest]
; A/B toggles for isolating sky issues at TerrainQuality=1.
; 1 = allow WORLD override on that draw type, 0 = disable.
WorldOverrideOnDP=1
WorldOverrideOnDIP=1
; If SetVertexShaderConstantF does not update c17-c20 on a draw,
; preserve existing WORLD instead of forcing identity.
; 1 = preserve (recommended), 0 = legacy identity fallback.
PreserveWorldOnMvStall=1
; TerrainQuality=2 terrain path guard:
; arm on known terrain SetVertexShaderConstantF callers and skip WORLD override
; for the next known dxwrapper DIP call only.
; 1 = enabled, 0 = disabled.
TerrainQ2LatchGuard=1
; Force identity VIEW to emulate no-ASI/no-proxy camera path for isolation.
ForceIdentityView=0
; Preserve legacy behavior that drops identity VIEW calls.
RejectIdentityView=0
